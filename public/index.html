<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5f8">
  <meta name="description" content="Share feedback about your learning session.">
  <title>Session Feedback</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page-shell">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span>SESSION FEEDBACK</span>
    </header>

    <section class="feedback-card" aria-labelledby="page-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> YOUR VOICE MATTERS</div>
      <h1 id="page-title">Help us make the next session better.</h1>
      <p class="intro">Tell us what worked well and what we can improve. Your feedback goes straight to the organizers.</p>

      <form id="feedbackForm">
        <div class="form-grid">
          <div class="field">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Enter your name" required>
          </div>
          <div class="field">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" placeholder="e.g. Information Technology" required>
          </div>
        </div>

        <div class="field">
          <label for="sessionTitle">Session title</label>
          <input type="text" id="sessionTitle" name="sessionTitle" placeholder="Which session are you reviewing?" required>
        </div>

        <div class="field">
          <label for="feedback">What did you think?</label>
          <textarea id="feedback" name="feedback" rows="4" placeholder="Share what you found useful or interesting..." required></textarea>
        </div>

        <div class="field">
          <label for="suggestions">What could be better?</label>
          <textarea id="suggestions" name="suggestions" rows="3" placeholder="Any ideas for the next session?" required></textarea>
        </div>

        <div class="form-footer">
          <p id="message" class="message" role="status" aria-live="polite"></p>
          <button id="submitButton" type="submit">
            <span>Send feedback</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </form>
    </section>

    <footer class="page-footer">Thank you for helping us learn and improve.</footer>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
